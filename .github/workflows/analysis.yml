name: Reproduce synthetic audit
on: [push, pull_request, workflow_dispatch]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m src.run_analysis --output-dir .repro-output
      - run: python scripts/check_reproduction.py .repro-output
